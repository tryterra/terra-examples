plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'co.tryterra.grip.wear'
  compileSdk 34

  defaultConfig {
    // Same package as the phone app: Play distributes the watch binary
    // under the same listing (Wear OS form factor track).
    applicationId 'co.tryterra.streamingdemo'
    minSdk 30
    targetSdk 34
    // Must be unique across ALL artifacts of this package on Play. The phone
    // app's versionCode is managed by EAS (remote, currently ~11 and
    // incrementing), so the watch sits in a separate high band to guarantee
    // no collision. Bump this for each new watch upload.
    versionCode 1000
    versionName '1.1.0'
  }

  signingConfigs {
    // Signs with the same Play upload key as the phone app. The keystore path
    // and passwords come from ~/.gradle/gradle.properties (TERRA_UPLOAD_*) or
    // CI env — never committed. Falls back to unsigned (debug) when absent so
    // local dev builds still work.
    release {
      if (project.hasProperty('TERRA_UPLOAD_STORE_FILE')) {
        storeFile file(TERRA_UPLOAD_STORE_FILE)
        storePassword TERRA_UPLOAD_STORE_PASSWORD
        keyAlias TERRA_UPLOAD_KEY_ALIAS
        keyPassword TERRA_UPLOAD_KEY_PASSWORD
      }
    }
  }

  buildTypes {
    release {
      if (project.hasProperty('TERRA_UPLOAD_STORE_FILE')) {
        signingConfig signingConfigs.release
      }
      minifyEnabled false
    }
  }

  buildFeatures {
    compose true
  }
  composeOptions {
    kotlinCompilerExtensionVersion '1.5.14'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'co.tryterra:terra-wearos:0.0.6'
  implementation 'androidx.activity:activity-compose:1.9.0'
  implementation 'androidx.wear.compose:compose-material:1.3.1'
  implementation 'androidx.wear.compose:compose-foundation:1.3.1'
}
